<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>🩺 MICROCASOS · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🩺 MICROCASOS</span><div class="small" id="count"></div><div class="box" style="margin-top:12px"><div id="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const QS=[["¿Qué significa IRMA?",["Intraretinal Microvascular Abnormalities — anomalías microvasculares intrarretinianas","Internal Retinal Macular Atrophy","Intraocular Retinal Microaneurysm Area","Ischemic Retinal Macular Artery"],0,"IRMA son anomalías microvasculares intrarretinianas; se asocian con isquemia y NPDR severa cuando son prominentes en el criterio 4-2-1.","IRMA"],["Según la regla 4-2-1, ¿qué hallazgo por sí solo puede clasificar la NPDR como severa?",["IRMA prominentes en ≥1 cuadrante","Un microaneurisma aislado","Un exudado duro","Una drusa"],0,"La regla 4-2-1 incluye IRMA prominentes en al menos un cuadrante como criterio de NPDR severa.","4-2-1"],["Según 4-2-1, ¿qué patrón de hemorragias/microaneurismas corresponde a NPDR severa?",["4 cuadrantes","1 cuadrante","2 cuadrantes","Solo polo posterior"],0,"Hemorragias/microaneurismas en 4 cuadrantes cumplen el criterio '4'.","4-2-1"],["Según 4-2-1, ¿qué patrón de venous beading corresponde a NPDR severa?",["2 cuadrantes","1 cuadrante","4 cuadrantes","Ninguno"],0,"El venous beading en al menos 2 cuadrantes cumple el criterio '2'.","4-2-1"],["¿Qué hallazgo convierte la retinopatía diabética en proliferativa?",["Neovascularización","Microaneurismas","Exudados duros","Hemorragias aisladas"],0,"La neovascularización retiniana o del disco define la categoría proliferativa.","PDR"]];let i=0,errors=0;function draw(){let z=QS[i];document.getElementById("count").textContent="Pregunta "+(i+1)+" de "+QS.length;document.getElementById("q").innerHTML="<div class='question'>"+z[0]+"</div>";document.getElementById("answers").innerHTML=z[1].map((a,n)=>"<button class='answer' onclick='pick("+n+")'>"+String.fromCharCode(65+n)+") "+a+"</button>").join("");document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}function pick(n){let z=QS[i],bs=[...document.querySelectorAll(".answer")],ok=n===z[2];bs[z[2]].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)addXP();else{bs[n].classList.add("wrong");errors++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z[3];document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=function(){i++;if(i>=QS.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+errors+" · XP total: "+XP+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}else draw()};draw();</script></body></html>
