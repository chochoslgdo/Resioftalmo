<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/resioftalmo.css"><title>🩺 MICROCASOS · RESIOFTALMO</title></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp">0 XP</div></div><button class="back" onclick="goHome()">‹ RESIOFTALMO</button><span class="badge">🩺 MICROCASOS</span><div class="small" id="count"></div><div class="questionbox" style="margin-top:14px"><div id="q"></div><div id="media"></div><div class="answers" id="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script src="js/common.js"></script><script>const qs=[["¿Qué significa IRMA?",["Intraretinal Microvascular Abnormalities — anomalías microvasculares intrarretinianas","Internal Retinal Macular Atrophy","Intraocular Retinal Microaneurysm Area","Ischemic Retinal Macular Artery"],0,"IRMA son anomalías microvasculares intrarretinianas; se asocian con isquemia y NPDR severa cuando son prominentes en el criterio 4-2-1.","IRMA"],["Según la regla 4-2-1, ¿qué hallazgo por sí solo puede clasificar la NPDR como severa?",["IRMA prominentes en ≥1 cuadrante","Un microaneurisma aislado","Un exudado duro","Una drusa"],0,"La regla 4-2-1 incluye IRMA prominentes en al menos un cuadrante como criterio de NPDR severa.","4-2-1"],["Según 4-2-1, ¿qué patrón de hemorragias/microaneurismas corresponde a NPDR severa?",["4 cuadrantes","1 cuadrante","2 cuadrantes","Solo polo posterior"],0,"Hemorragias/microaneurismas en 4 cuadrantes cumplen el criterio '4'.","4-2-1"],["Según 4-2-1, ¿qué patrón de venous beading corresponde a NPDR severa?",["2 cuadrantes","1 cuadrante","4 cuadrantes","Ninguno"],0,"El venous beading en al menos 2 cuadrantes cumple el criterio '2'.","4-2-1"],["¿Qué hallazgo convierte la retinopatía diabética en proliferativa?",["Neovascularización","Microaneurismas","Exudados duros","Hemorragias aisladas"],0,"La neovascularización retiniana o del disco define la categoría proliferativa.","PDR"]];let i=0,wrong=0;function draw(){const z=qs[i];document.getElementById("count").textContent=`Pregunta ${i+1} de ${qs.length}`;document.getElementById("q").innerHTML="<div class='question'>"+z.q+"</div>";document.getElementById("media").innerHTML="";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");if(z.img){const im=document.createElement("img");im.className="clinical-img";im.src=z.img;im.alt=z.title||"Imagen clínica";im.onerror=()=>{im.remove();document.getElementById("media").innerHTML="<div class='feedback'>⚠️ Imagen no disponible.</div>"};document.getElementById("media").appendChild(im)}document.getElementById("answers").innerHTML=z.a.map((a,n)=>`<button class="answer" onclick="pick(${n})">${String.fromCharCode(65+n)}) ${a}</button>`).join("")}function pick(n){const z=qs[i],bs=[...document.querySelectorAll(".answer")],ok=n===z.c;bs[z.c].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)setXP(xp+100);else{bs[n].classList.add("wrong");wrong++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z.e+(z.source?`<div class='source'>Fuente: ${z.source}</div>`:"");document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=()=>{i++;if(i>=qs.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+wrong+" · XP: "+xp+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");return}draw()};draw();</script></body></html>
