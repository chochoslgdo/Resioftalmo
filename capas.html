";im.onerror=()=>{im.remove();document.getElementById("media").innerHTML="<div class='feedback'>⚠️ Imagen no disponible.</div>"};document.getElementById("media").appendChild(im)}document.getElementById("answers").innerHTML=z.a.map((a,n)=>`<button class="answer" onclick="pick(${n})">${String.fromCharCode(65+n)}) ${a}</button>`).join("")}function pick(n){const z=qs[i],bs=[...document.querySelectorAll(".answer")],ok=n===z.c;bs[z.c].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)setXP(xp+100);else{bs[n].classList.add("wrong");wrong++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z.e+(z.source?`<div class='source'>Fuente: ${z.source}</div>`:"");document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=()=>{i++;if(i>=qs.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+wrong+" · XP: "+xp+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");return}draw()};draw();</script></body></html>
