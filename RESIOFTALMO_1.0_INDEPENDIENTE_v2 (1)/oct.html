<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>🩻 INTERPRETA EL OCT · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🩻 INTERPRETA EL OCT</span><div class="small" id="count"></div><div class="box" style="margin-top:12px"><div id="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const QS=[["En OCT, ¿qué patrón es compatible con una lesión isquémica superficial como un exudado algodonoso?",["Hiperreflectividad de capas internas","Líquido subretiniano","PED","Cavidad vítrea"],0,"Las lesiones isquémicas agudas de la retina interna pueden mostrar hiperreflectividad de las capas internas.","OCT"],["¿Qué patrón de OCT sugiere ERM?",["Banda hiperreflectiva sobre la superficie interna con distorsión","Espacio subretiniano aislado","PED sin tracción","Atrofia coroidea aislada"],0,"La ERM aparece como una banda hiperreflectiva sobre la superficie retinal interna y puede distorsionar la arquitectura macular.","ERM"],["SRF significa:",["Subretinal Fluid — líquido subretiniano","Superficial Retinal Fibrosis","Subfoveal Retinal Flow","Serous Retinal Fibrosis"],0,"SRF es líquido ubicado entre la retina neurosensorial y el EPR.","SRF"],["¿Dónde se localiza el líquido subretiniano en OCT?",["Entre retina neurosensorial y EPR","Dentro del vítreo","Dentro de la coroides","Entre córnea y cristalino"],0,"El SRF separa la retina neurosensorial del epitelio pigmentario de la retina.","SRF"],["PED significa:",["Pigment Epithelial Detachment — desprendimiento del epitelio pigmentario","Posterior Epiretinal Disorder","Peripheral Edema Detachment","Photoreceptor Epithelial Degeneration"],0,"PED es elevación/separación del EPR respecto de la membrana de Bruch.","PED"],["¿Qué es un agujero macular de espesor completo?",["Defecto de espesor completo de la retina neurosensorial en la fóvea","Desprendimiento del EPR","Hemorragia vítrea","Drusa blanda"],0,"El agujero macular de espesor completo atraviesa las capas neurosensoriales hasta la superficie interna.","Agujero macular"],["RNFL significa:",["Retinal Nerve Fiber Layer — capa de fibras nerviosas de la retina","Retinal Nuclear Fiber Layer","Retinal Neurovascular Flow Layer","Retinal Foveal Nerve Layer"],0,"RNFL corresponde a la capa de fibras nerviosas de la retina.","OCT"],["GCC significa:",["Ganglion Cell Complex — complejo de células ganglionares","Glial Choroidal Complex","Ganglion Capillary Circle","Global Choroidal Count"],0,"GCC agrupa capas relacionadas con células ganglionares y sus prolongaciones; es usado en análisis de glaucoma.","OCT"],["¿Qué patrón de OCT corresponde a edema intrarretiniano?",["Espacios hiporreflectivos dentro de la retina","Espacio entre retina y EPR","Elevación del EPR exclusivamente","Hiperreflectividad coroidea aislada"],0,"El líquido intrarretiniano suele verse como espacios hiporreflectivos/císticos dentro de la retina.","OCT"],["DME significa:",["Diabetic Macular Edema — edema macular diabético","Dry Macular Epithelium","Diabetic Microvascular Exudation","Diffuse Macular Epithelium"],0,"DME es edema macular diabético.","DME"]];let i=0,errors=0;function draw(){let z=QS[i];document.getElementById("count").textContent="Pregunta "+(i+1)+" de "+QS.length;document.getElementById("q").innerHTML="<div class='question'>"+z[0]+"</div>";document.getElementById("answers").innerHTML=z[1].map((a,n)=>"<button class='answer' onclick='pick("+n+")'>"+String.fromCharCode(65+n)+") "+a+"</button>").join("");document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}function pick(n){let z=QS[i],bs=[...document.querySelectorAll(".answer")],ok=n===z[2];bs[z[2]].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)addXP();else{bs[n].classList.add("wrong");errors++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z[3];document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=function(){i++;if(i>=QS.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+errors+" · XP total: "+XP+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}else draw()};draw();</script></body></html>
