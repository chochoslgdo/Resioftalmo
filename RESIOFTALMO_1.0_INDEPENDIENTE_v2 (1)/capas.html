x){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🔬 ¿EN QUÉ CAPA ESTÁ?</span><div class="small" id="count"></div><div class="box" style="margin-top:12px"><div id="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const QS=[["¿En qué capa se localiza principalmente un exudado algodonoso?",["Capa de fibras nerviosas de la retina (RNFL)","Capa nuclear externa (ONL)","EPR","Coroides"],0,"Se relaciona con la capa de fibras nerviosas de la retina (RNFL, Retinal Nerve Fiber Layer).","Anatomía"],["En OCT, ¿qué patrón es compatible con una lesión isquémica superficial como un exudado algodonoso?",["Hiperreflectividad de capas internas","Líquido subretiniano","PED","Cavidad vítrea"],0,"Las lesiones isquémicas agudas de la retina interna pueden mostrar hiperreflectividad de las capas internas.","OCT"],["¿Qué estructura contiene los fotorreceptores?",["Retina neurosensorial","Coroides exclusivamente","Vítreo","Esclera"],0,"Los conos y bastones forman parte de la retina neurosensorial.","Anatomía retinal"],["¿Qué capa se encuentra directamente externa a los fotorreceptores en la organización clínica del OCT?",["Epitelio pigmentario de la retina (EPR)","RNFL","ILM","Vítreo"],0,"El EPR está externo a los segmentos de los fotorreceptores y participa en su soporte metabólico.","Anatomía OCT"],["ILM significa:",["Internal Limiting Membrane — membrana limitante interna","Inner Lens Membrane","Internal Macular Layer","Intermediate Limiting Macula"],0,"ILM es la membrana limitante interna, en la interfaz retina-vítreo.","OCT"],["RNFL significa:",["Retinal Nerve Fiber Layer — capa de fibras nerviosas de la retina","Retinal Nuclear Fiber Layer","Retinal Neurovascular Flow Layer","Retinal Foveal Nerve Layer"],0,"RNFL corresponde a la capa de fibras nerviosas de la retina.","OCT"],["GCC significa:",["Ganglion Cell Complex — complejo de células ganglionares","Glial Choroidal Complex","Ganglion Capillary Circle","Global Choroidal Count"],0,"GCC agrupa capas relacionadas con células ganglionares y sus prolongaciones; es usado en análisis de glaucoma.","OCT"],["¿Qué patrón de OCT corresponde a edema intrarretiniano?",["Espacios hiporreflectivos dentro de la retina","Espacio entre retina y EPR","Elevación del EPR exclusivamente","Hiperreflectividad coroidea aislada"],0,"El líquido intrarretiniano suele verse como espacios hiporreflectivos/císticos dentro de la retina.","OCT"],["DME significa:",["Diabetic Macular Edema — edema macular diabético","Dry Macular Epithelium","Diabetic Microvascular Exudation","Diffuse Macular Epithelium"],0,"DME es edema macular diabético.","DME"],["¿Cuál es una herramienta clave para cuantificar edema macular y caracterizar líquido?",["OCT","Paquimetría corneal","Campimetría exclusivamente","Topografía corneal"],0,"La OCT permite identificar y seguir líquido intrarretiniano, subretiniano y cambios estructurales maculares.","DME"]];let i=0,errors=0;function draw(){let z=QS[i];document.getElementById("count").textContent="Pregunta "+(i+1)+" de "+QS.length;document.getElementById("q").innerHTML="<div class='question'>"+z[0]+"</div>";document.getElementById("answers").innerHTML=z[1].map((a,n)=>"<button class='answer' onclick='pick("+n+")'>"+String.fromCharCode(65+n)+") "+a+"</button>").join("");document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}function pick(n){let z=QS[i],bs=[...document.
