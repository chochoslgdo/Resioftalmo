<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microcasos · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🩺 MICROCASOS</span><div class="small" id="count"></div><div class="box" style="margin-top:12px"><div id="case"></div><div class="section">¿Cuál es tu conducta / diagnóstico?</div><div id="answers" class="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Siguiente caso →</button></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const C=[["Paciente de 58 años con diabetes de 15 años. Fondo de ojo: microaneurismas, hemorragias puntiformes y exudados duros, sin neovascularización. ¿Cuál es el diagnóstico?",["Retinopatía diabética no proliferativa","Retinopatía diabética proliferativa","Oclusión venosa","Degeneración macular"],0,"La ausencia de neovasos y estos hallazgos corresponden a retinopatía diabética no proliferativa."],["Paciente de 67 años con pérdida visual central y metamorfopsia. OCT: líquido intrarretiniano y subretiniano con lesión neovascular subfoveal. ¿Cuál es la conducta inicial?",["Observación","Anti-VEGF intravítreo","Fotocoagulación panretiniana","Capsulotomía YAG"],1,"El cuadro es compatible con DMAE neovascular activa; el tratamiento inicial es anti-VEGF intravítreo."],["Paciente de 72 años con PIO 26 mmHg, ángulo abierto, adelgazamiento inferior de RNFL y defecto arcuato superior en campimetría. ¿Diagnóstico?",["Hipertensión ocular aislada","Glaucoma primario de ángulo abierto","Glaucoma de ángulo cerrado","Neuritis óptica"],1,"Existe daño estructural y funcional glaucomatoso con ángulo abierto."],["Paciente de 70 años con visión borrosa progresiva, glare nocturno y opacidad nuclear amarillenta del cristalino. ¿Qué esperas principalmente?",["Disminución visual progresiva","Pérdida súbita de visión","Defecto pupilar aferente como hallazgo principal","Diplopía binocular obligatoria"],0,"La catarata produce disminución visual progresiva, glare y pérdida de contraste."],["Niño de 4 años con endotropía constante desde los 8 meses, hipermetropía moderada y fijación preferencial del ojo izquierdo. ¿Qué conducta debe considerarse?",["Solo observar","Corrección óptica y valoración de ambliopía/estrabismo","Fotocoagulación","Cirugía de catarata"],1,"Hay que corregir la ametropía y valorar/tratar ambliopía y características del estrabismo."],["Paciente de 64 años con flashes, miodesopsias súbitas y hemorragia vítrea que impide visualizar la retina. ¿Qué estudio es especialmente útil?",["Ultrasonido ocular modo B","Paquimetría","Topografía corneal","Biometría"],0,"El ultrasonido modo B permite valorar la retina cuando el fondo no es visible."],["OCT: banda hiperreflectiva sobre la superficie interna de la retina con distorsión de la arquitectura macular. ¿Diagnóstico?",["Membrana epirretiniana","Desprendimiento total de retina","Hemorragia coroidea","Catarata"],0,"La membrana epirretiniana se localiza sobre la superficie interna de la retina y puede generar tracción."],["Paciente hipertenso con hemorragias en llama, exudados algodonosos y estrechamiento arteriolar. ¿Diagnóstico?",["Retinopatía hipertensiva","Retinopatía del prematuro","Retinitis por CMV","Desprendimiento de retina"],0,"Los hallazgos son característicos de retinopatía hipertensiva."]];let i=0,e=0;function draw(){let z=C[i];count.textContent="Caso "+(i+1)+" de "+C.length;case_.innerHTML="<div class='question'>"+z[0]+"</div>";answers.innerHTML=z[1].map((a,n)=>"<button class='answer' onclick='pick("+n+")'>"+String.fromCharCode(65+n)+") "+a+"</button>").join("");fb.classList.add("hidden");next.classList.add("hidden")}function pick(n){let z=C[i],bs=[...document.querySelectorAll(".answer")],ok=n===z[2];bs[z[2]].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)addXP();else{bs[n].classList.add("wrong");e++}fb.innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Razonamiento:</b> "+z[3];fb.classList.remove("hidden");next.classList.remove("hidden")}next.onclick=()=>{i++;if(i<C.length)draw();else{case_.innerHTML="<div class='question'>🎉 Casos terminados</div>";answers.innerHTML="<div class='card'>Errores: "+e+" · XP total: "+XP+"</div>";fb.classList.add("hidden");next.classList.add("hidden")}};const case_=document.getElementById("case"),answers=document.getElementById("answers"),fb=document.getElementById("fb"),next=document.getElementById("next"),count=document.getElementById("count");draw();</script></body></html>
