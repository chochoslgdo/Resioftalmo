<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>💉 ¿TRATAS O NO TRATAS? · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">💉 ¿TRATAS O NO TRATAS?</span><div class="small" id="count"></div><div class="box" style="margin-top:12px"><div id="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const QS=[["¿Qué tratamiento ha sido fundamental para reducir el riesgo de pérdida visual grave en PDR?",["Fotocoagulación panretiniana (PRP, Panretinal Photocoagulation)","Láser YAG posterior","Láser focal corneal","Observación en todos los casos"],0,"La PRP es un tratamiento fundamental de la PDR; la conducta se individualiza y puede incluir anti-VEGF o cirugía según el caso.","PRP"],["¿Qué tratamiento se utiliza para una rotura retinal sintomática con retina aplicada?",["Retinopexia con láser o crioterapia","PRP completa siempre","Oclusión ocular","Láser YAG"],0,"Las roturas sintomáticas con tracción pueden requerir retinopexia para crear una adhesión alrededor de la lesión.","Rotura retinal"],["¿Qué es una hemorragia prerretiniana/subhialoidea?",["Sangre localizada anterior a la retina, bajo la hialoides posterior o en espacio subhialoideo","Sangre dentro de la coroides únicamente","Sangre dentro del cristalino","Sangre exclusivamente sub-EPR"],0,"La hemorragia prerretiniana se sitúa por delante de la retina, en relación con la hialoides posterior.","Hemorragia retinal"],["¿Qué componente define un desprendimiento de retina regmatógeno?",["Una rotura retinal","Edema macular","Drusas","Hemorragia conjuntival"],0,"La presencia de una rotura retinal permite el paso de líquido al espacio subretiniano.","Desprendimiento de retina"],["¿La degeneración lattice asintomática debe recibir láser profiláctico de rutina en todos los casos?",["No","Sí, siempre","Solo si hay catarata","Solo si existe ojo seco"],0,"El tratamiento profiláctico rutinario de toda lattice no está generalmente indicado; la decisión depende del riesgo y del contexto clínico.","Lattice"]];let i=0,errors=0;function draw(){let z=QS[i];document.getElementById("count").textContent="Pregunta "+(i+1)+" de "+QS.length;document.getElementById("q").innerHTML="<div class='question'>"+z[0]+"</div>";document.getElementById("answers").innerHTML=z[1].map((a,n)=>"<button class='answer' onclick='pick("+n+")'>"+String.fromCharCode(65+n)+") "+a+"</button>").join("");document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}function pick(n){let z=QS[i],bs=[...document.querySelectorAll(".answer")],ok=n===z[2];bs[z[2]].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)addXP();else{bs[n].classList.add("wrong");errors++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z[3];document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=function(){i++;if(i>=QS.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+errors+" · XP total: "+XP+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}else draw()};draw();</script></body></html>
