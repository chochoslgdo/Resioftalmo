<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/resioftalmo.css"><title>💉 ¿TRATAS O NO TRATAS? · RESIOFTALMO</title></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp">0 XP</div></div><button class="back" onclick="goHome()">‹ RESIOFTALMO</button><span class="badge">💉 ¿TRATAS O NO TRATAS?</span><div class="small" id="count"></div><div class="questionbox" style="margin-top:14px"><div id="q"></div><div id="media"></div><div class="answers" id="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script src="js/common.js"></script><script>const qs=[["¿Qué tratamiento ha sido fundamental para reducir el riesgo de pérdida visual grave en PDR?",["Fotocoagulación panretiniana (PRP, Panretinal Photocoagulation)","Láser YAG posterior","Láser focal corneal","Observación en todos los casos"],0,"La PRP es un tratamiento fundamental de la PDR; la conducta se individualiza y puede incluir anti-VEGF o cirugía según el caso.","PRP"],["¿Qué tratamiento se utiliza para una rotura retinal sintomática con retina aplicada?",["Retinopexia con láser o crioterapia","PRP completa siempre","Oclusión ocular","Láser YAG"],0,"Las roturas sintomáticas con tracción pueden requerir retinopexia para crear una adhesión alrededor de la lesión.","Rotura retinal"],["¿Qué es una hemorragia prerretiniana/subhialoidea?",["Sangre localizada anterior a la retina, bajo la hialoides posterior o en espacio subhialoideo","Sangre dentro de la coroides únicamente","Sangre dentro del cristalino","Sangre exclusivamente sub-EPR"],0,"La hemorragia prerretiniana se sitúa por delante de la retina, en relación con la hialoides posterior.","Hemorragia retinal"],["¿Qué componente define un desprendimiento de retina regmatógeno?",["Una rotura retinal","Edema macular","Drusas","Hemorragia conjuntival"],0,"La presencia de una rotura retinal permite el paso de líquido al espacio subretiniano.","Desprendimiento de retina"],["¿La degeneración lattice asintomática debe recibir láser profiláctico de rutina en todos los casos?",["No","Sí, siempre","Solo si hay catarata","Solo si existe ojo seco"],0,"El tratamiento profiláctico rutinario de toda lattice no está generalmente indicado; la decisión depende del riesgo y del contexto clínico.","Lattice"]];let i=0,wrong=0;function draw(){const z=qs[i];document.getElementById("count").textContent=`Pregunta ${i+1} de ${qs.length}`;document.getElementById("q").innerHTML="<div class='question'>"+z[0]+"</div>";document.getElementById("media").innerHTML="";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");if(z.img){const im=document.createElement("img");im.className="clinical-img";im.src=z.img;im.alt=z.title||"Imagen clínica";im.onerror=()=>{im.remove();document.getElementById("media").innerHTML="<div class='feedback'>⚠️ Imagen no disponible.</div>"};document.getElementById("media").appendChild(im)}document.getElementById("answers").innerHTML=z[1].map((a,n)=>`<button class="answer" onclick="pick(${n})">${String.fromCharCode(65+n)}) ${a}</button>`).join("")}function pick(n){const z=qs[i],bs=[...document.querySelectorAll(".answer")],ok=n===z[2];bs[z[2]].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)setXP(xp+100);else{bs[n].classList.add("wrong");wrong++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z[3]+(z.source?`<div class='source'>Fuente: ${z.source}</div>`:"");document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=()=>{i++;if(i>=qs.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+wrong+" · XP: "+xp+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");return}draw()};draw();</script></body></html>
