<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/resioftalmo.css"><title>📸 ¿QUÉ ESTÁS VIENDO? · RESIOFTALMO</title></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp">0 XP</div></div><button class="back" onclick="goHome()">‹ RESIOFTALMO</button><span class="badge">📸 ¿QUÉ ESTÁS VIENDO?</span><div class="small" id="count"></div><div class="questionbox" style="margin-top:14px"><div id="q"></div><div id="media"></div><div class="answers" id="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script src="js/common.js"></script><script>const qs=[{"img":"https://upload.wikimedia.org/wikipedia/commons/0/07/Fundus_-_diabetic_retinopathy.png","title":"Fondo de ojo · retinopatía diabética","source":"Wikimedia Commons · CC BY 4.0","q":"En esta fotografía de fondo de ojo se observan exudados duros, microaneurismas y pequeñas hemorragias. ¿Cuál es el diagnóstico/contexto más compatible?","a":["Retinopatía diabética","Desprendimiento regmatógeno","Retinitis por CMV","Oclusión de arteria central"],"c":0,"e":"El fondo muestra hallazgos clásicos de retinopatía diabética."},{"img":"https://upload.wikimedia.org/wikipedia/commons/f/f1/MacularEdema_OCT_2-3D_LeftE_with-out_arrows.png","title":"OCT · edema macular","source":"Wikimedia Commons · CC BY-SA 3.0","q":"El OCT muestra engrosamiento macular y espacios hiporreflectivos intrarretinianos. ¿Qué hallazgo corresponde?","a":["Edema macular","Desprendimiento del EPR","Membrana epirretiniana aislada","Atrofia coroidea"],"c":0,"e":"Los espacios hiporreflectivos intrarretinianos con engrosamiento retinal son compatibles con edema macular."},{"img":"https://upload.wikimedia.org/wikipedia/commons/a/a2/EpiretinalMembrane_OCT.png","title":"OCT · membrana epirretiniana","source":"Wikimedia Commons · CC BY-SA 3.0","q":"En este OCT se observa una banda hiperreflectiva sobre la superficie interna de la retina con distorsión macular. ¿Qué es?","a":["Membrana epirretiniana","Líquido subretiniano","Desprendimiento del EPR","Agujero macular"],"c":0,"e":"La membrana epirretiniana aparece sobre la superficie interna de la retina y puede producir tracción y distorsión."}];let i=0,wrong=0;function draw(){const z=qs[i];document.getElementById("count").textContent=`Pregunta ${i+1} de ${qs.length}`;document.getElementById("q").innerHTML="<div class='question'>"+z.q+"</div>";document.getElementById("media").innerHTML="";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");if(z.img){const im=document.createElement("img");im.className="clinical-img";im.src=z.img;im.alt=z.title||"Imagen clínica";im.onerror=()=>{im.remove();document.getElementById("media").innerHTML="<div class='feedback'>⚠️ Imagen no disponible.</div>"};document.getElementById("media").appendChild(im)}document.getElementById("answers").innerHTML=z.a.map((a,n)=>`<button class="answer" onclick="pick(${n})">${String.fromCharCode(65+n)}) ${a}</button>`).join("")}function pick(n){const z=qs[i],bs=[...document.querySelectorAll(".answer")],ok=n===z.c;bs[z.c].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)setXP(xp+100);else{bs[n].classList.add("wrong");wrong++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z.e+(z.source?`<div class='source'>Fuente: ${z.source}</div>`:"");document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=()=>{i++;if(i>=qs.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+wrong+" · XP: "+xp+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");return}draw()};draw();</script></body></html>
