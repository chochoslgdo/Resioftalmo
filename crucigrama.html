<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crucigrama · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🧩 CRUCIGRAMA</span><div class="small">Completa las palabras. Las respuestas no se muestran.</div><div id="grid" style="overflow:auto;margin-top:16px"></div><div id="clues" class="clues"></div><button class="primary" onclick="check()">Comprobar</button><div id="result" class="feedback hidden"></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const D={"rows":10,"cols":8,"cells":[{"r":0,"c":2,"ch":"R"},{"r":0,"c":3,"ch":"E"},{"r":0,"c":4,"ch":"T"},{"r":0,"c":5,"ch":"I"},{"r":0,"c":6,"ch":"N"},{"r":0,"c":7,"ch":"A"},{"r":1,"c":3,"ch":"D"},{"r":2,"c":3,"ch":"E"},{"r":3,"c":3,"ch":"M"},{"r":4,"c":3,"ch":"A"},{"r":4,"c":2,"ch":"M"},{"r":4,"c":4,"ch":"C"},{"r":4,"c":5,"ch":"U"},{"r":4,"c":6,"ch":"L"},{"r":4,"c":7,"ch":"A"},{"r":6,"c":0,"ch":"C"},{"r":6,"c":1,"ch":"A"},{"r":6,"c":2,"ch":"T"},{"r":6,"c":3,"ch":"A"},{"r":6,"c":4,"ch":"R"},{"r":6,"c":5,"ch":"A"},{"r":6,"c":6,"ch":"T"},{"r":6,"c":7,"ch":"A"},{"r":5,"c":5,"ch":"L"},{"r":7,"c":5,"ch":"S"},{"r":8,"c":5,"ch":"E"},{"r":9,"c":5,"ch":"R"}],"words":[{"word":"RETINA","dir":"H","r":0,"c":2,"clue":"Tejido neurosensorial que contiene fotorreceptores.","num":1},{"word":"EDEMA","dir":"V","r":0,"c":3,"clue":"Acumulación de líquido en un tejido.","num":2},{"word":"MACULA","dir":"H","r":4,"c":2,"clue":"Zona central de la retina especializada en visión fina.","num":3},{"word":"CATARATA","dir":"H","r":6,"c":0,"clue":"Opacificación del cristalino.","num":5},{"word":"LASER","dir":"V","r":5,"c":5,"clue":"Fuente de luz utilizada en tratamientos oftalmológicos.","num":4}]};const M={};D.cells.forEach(x=>M[x.r+"-"+x.c]=x);const G=document.getElementById("grid"),T=document.createElement("div");T.style.cssText="display:grid;grid-template-columns:repeat("+D.cols+",34px);gap:2px";for(let r=0;r<D.rows;r++)for(let c=0;c<D.cols;c++){let x=M[r+"-"+c],d=document.createElement("div");d.style.cssText="width:34px;height:34px;position:relative;background:"+(x?"white":"#111827")+";border:1px solid #cbd5e1";if(x){let inp=document.createElement("input");inp.maxLength=1;inp.dataset.answer=x.ch;inp.style.cssText="width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:800;font-size:18px;text-transform:uppercase";d.appendChild(inp);let w=D.words.find(w=>w.r===r&&w.c===c);if(w){let n=document.createElement("span");n.textContent=w.num;n.style.cssText="position:absolute;top:1px;left:2px;font-size:8px;color:#667085";d.appendChild(n)}}T.appendChild(d)}G.appendChild(T);D.words.forEach(w=>{let d=document.createElement("div");d.className="clue";d.innerHTML="<b>"+w.num+". "+(w.dir==="H"?"Horizontal":"Vertical")+"</b> · "+w.word.length+" letras<br>"+w.clue;document.getElementById("clues").appendChild(d)});function check(){let a=[...document.querySelectorAll("input")],ok=0;a.forEach(x=>{if(x.value.toUpperCase()===x.dataset.answer){x.style.color="green";ok++}else x.style.color="crimson"});result.innerHTML=ok===a.length?"🎯 <b>¡Correcto!</b>":"Correctas: "+ok+" de "+a.length;result.classList.remove("hidden")}</script></body></html>
