<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Crucigrama · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🧩 CRUCIGRAMA</span><div class="small">Completa las respuestas. Las siglas se muestran en español + inglés cuando corresponde.</div><div id="grid" class="cross" style="margin-top:16px"></div><div id="clues" class="clues"></div><button class="primary" onclick="check()">Comprobar</button><div id="result" class="feedback hidden"></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const WORDS=[["DESGARRO", "Rotura de espesor completo de la retina.", "H"], ["EDEMA", "Acumulación de líquido en un tejido.", "V"], ["CORNEA", "Estructura transparente anterior del ojo.", "H"], ["GLAUCOMA", "Neuropatía óptica caracterizada por daño progresivo del nervio óptico.", "H"], ["OCT", "Tomografía de coherencia óptica (sigla).", "V"], ["DIABETES", "Enfermedad metabólica asociada a retinopatía diabética.", "H"], ["IRMA", "Anomalías microvasculares intrarretinianas (sigla).", "V"], ["NEOVASOS", "Vasos sanguíneos nuevos anómalos.", "V"], ["MACULA", "Zona central de la retina especializada en visión fina.", "H"], ["RETINA", "Tejido neurosensorial que contiene fotorreceptores.", "H"], ["CATARATA", "Opacificación del cristalino.", "H"], ["LASER", "Fuente de luz utilizada en diferentes tratamientos oftalmológicos.", "H"]];const cells=[];const size=15;let placed=[];function place(w,r,c,dir){for(let i=0;i<w.length;i++){let rr=r+(dir==="V"?i:0),cc=c+(dir==="H"?i:0);if(rr>=size||cc>=size)return false;let old=placed.find(x=>x.r===rr&&x.c===cc);if(old&&old.ch!==w[i])return false}for(let i=0;i<w.length;i++){let rr=r+(dir==="V"?i:0),cc=c+(dir==="H"?i:0);placed.push({r:rr,c:cc,ch:w[i]})}return true}place("DESGARRO",0,0,"H");place("EDEMA",0,1,"V");place("CORNEA",2,2,"H");place("GLAUCOMA",4,5,"H");place("OCT",3,7,"V");place("DIABETES",6,5,"H");place("IRMA",6,6,"V");place("NEOVASOS",8,3,"V");place("MACULA",8,7,"H");place("RETINA",10,0,"H");place("CATARATA",12,2,"H");place("LASER",14,0,"H");function render(){let g=document.getElementById("grid");g.style.gridTemplateColumns="repeat("+size,30px)";let map={};placed.forEach(x=>map[x.r+"-"+x.c]=x);for(let r=0;r<size;r++)for(let c=0;c<size;c++){let x=map[r+"-"+c],d=document.createElement("div");d.className="cell "+(x?"":"block");if(x){let inp=document.createElement("input");inp.maxLength=1;inp.dataset.answer=x.ch;d.appendChild(inp)}g.appendChild(d)}let cl=document.getElementById("clues");WORDS.forEach((w,i)=>{let d=document.createElement("div");d.className="clue";d.innerHTML="<b>"+(i+1)+". "+(w[2]==="H"?"Horizontal":"Vertical")+"</b><br>"+w[1]+" <span class='small'>("+w[0].length+" letras)</span>";cl.appendChild(d)})}function check(){let ins=[...document.querySelectorAll("input")],ok=0;ins.forEach(x=>{if(x.value.toUpperCase()===x.dataset.answer){x.style.color="green";ok++}else x.style.color="crimson"});let res=document.getElementById("result");res.innerHTML=ok===ins.length?"🎯 <b>¡Crucigrama correcto!</b>":"Has acertado "+ok+" de "+ins.length+" casillas.";res.classList.remove("hidden");if(ok===ins.length)addXP()}render();</script></body></html>
