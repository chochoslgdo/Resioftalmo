<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>🧠 PREGUNTAS RÁPIDAS · RESIOFTALMO</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:22px 15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.xp{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.card,.mode,.box,.feedback{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{min-height:90px;text-align:left;font-size:16px;cursor:pointer}.small{display:block;color:#667085;font-size:13px;line-height:1.45;margin-top:6px}.section{font-size:13px;font-weight:800;color:#667085;letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px}.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}.badge{display:inline-block;background:#e8eefc;color:#304a9a;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.question{font-size:21px;font-weight:800;line-height:1.35;margin:15px 0}.answers{display:grid;gap:10px}.answer,.primary{width:100%;border:1px solid #d5dbe5;background:white;border-radius:13px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e9f8ef;border-color:#198754}.answer.wrong{background:#fff0f0;border-color:#c92a2a}.primary{background:#111827;color:white;text-align:center;margin-top:14px}.hidden{display:none!important}.feedback{margin-top:14px;line-height:1.5}.clinical-img{width:100%;max-height:430px;object-fit:contain;background:#111827;border-radius:16px;margin:12px 0}.source{font-size:11px;color:#667085;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.question{font-size:19px}}</style></head><body><main><div class="top"><div class="brand">👁️ RESIOFTALMO</div><div class="xp" id="xp">0 XP</div></div><button class="back" onclick="home()">‹ RESIOFTALMO</button><span class="badge">🧠 PREGUNTAS RÁPIDAS</span><div class="small" id="count"></div><div class="box" style="margin-top:12px"><div id="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback hidden"></div><button class="primary hidden" id="next">Continuar →</button></div></main><script>let XP=Number(localStorage.getItem("resioftalmoXP")||0);function updateXP(){document.getElementById("xp").textContent=XP+" XP"}function home(){location.href="index.html"}function addXP(){XP+=100;localStorage.setItem("resioftalmoXP",XP);updateXP()}updateXP();const QS=[["¿Qué hallazgo retiniano es una lesión blanquecina, superficial y de bordes difusos, asociada a isquemia de la retina interna?",["Exudado duro","Exudado algodonoso","Drusa","Hemorragia subretiniana"],1,"El exudado algodonoso (cotton-wool spot) representa una zona de isquemia/infarcto de la capa de fibras nerviosas de la retina.","Exudado algodonoso"],["¿En qué capa se localiza principalmente un exudado algodonoso?",["Capa de fibras nerviosas de la retina (RNFL)","Capa nuclear externa (ONL)","EPR","Coroides"],0,"Se relaciona con la capa de fibras nerviosas de la retina (RNFL, Retinal Nerve Fiber Layer).","Anatomía"],["En OCT, ¿qué patrón es compatible con una lesión isquémica superficial como un exudado algodonoso?",["Hiperreflectividad de capas internas","Líquido subretiniano","PED","Cavidad vítrea"],0,"Las lesiones isquémicas agudas de la retina interna pueden mostrar hiperreflectividad de las capas internas.","OCT"],["¿Qué lesión corresponde a una pequeña dilatación sacular de un capilar retinal, típica de retinopatía diabética?",["Microaneurisma","IRMA","NVE","Drusa"],0,"El microaneurisma es una manifestación temprana de retinopatía diabética.","Retinopatía diabética"],["¿Qué son los exudados duros?",["Depósitos lipídicos/proteicos amarillentos","Infartos de la RNFL","Vasos nuevos","Líquido subretiniano"],0,"Son depósitos lipídicos/proteicos asociados a fuga vascular crónica, especialmente alrededor de edema retinal.","Exudado duro"],["¿Qué significa IRMA?",["Intraretinal Microvascular Abnormalities — anomalías microvasculares intrarretinianas","Internal Retinal Macular Atrophy","Intraocular Retinal Microaneurysm Area","Ischemic Retinal Macular Artery"],0,"IRMA son anomalías microvasculares intrarretinianas; se asocian con isquemia y NPDR severa cuando son prominentes en el criterio 4-2-1.","IRMA"],["Según la regla 4-2-1, ¿qué hallazgo por sí solo puede clasificar la NPDR como severa?",["IRMA prominentes en ≥1 cuadrante","Un microaneurisma aislado","Un exudado duro","Una drusa"],0,"La regla 4-2-1 incluye IRMA prominentes en al menos un cuadrante como criterio de NPDR severa.","4-2-1"],["Según 4-2-1, ¿qué patrón de hemorragias/microaneurismas corresponde a NPDR severa?",["4 cuadrantes","1 cuadrante","2 cuadrantes","Solo polo posterior"],0,"Hemorragias/microaneurismas en 4 cuadrantes cumplen el criterio '4'.","4-2-1"],["Según 4-2-1, ¿qué patrón de venous beading corresponde a NPDR severa?",["2 cuadrantes","1 cuadrante","4 cuadrantes","Ninguno"],0,"El venous beading en al menos 2 cuadrantes cumple el criterio '2'.","4-2-1"],["¿Qué hallazgo convierte la retinopatía diabética en proliferativa?",["Neovascularización","Microaneurismas","Exudados duros","Hemorragias aisladas"],0,"La neovascularización retiniana o del disco define la categoría proliferativa.","PDR"],["NVD significa:",["Neovascularization of the Disc — neovascularización del disco","Nerve Vascular Disease","New Vessel Diameter","Neurovascular Disc Degeneration"],0,"NVD es neovascularización del disco óptico.","NVD"],["NVE significa:",["Neovascularization Elsewhere — neovascularización en otra localización de la retina","New Vitreous Edema","Neural Vascular Elevation","Nerve Vein Exudation"],0,"NVE se usa para neovascularización fuera del disco.","NVE"],["¿Qué tratamiento ha sido fundamental para reducir el riesgo de pérdida visual grave en PDR?",["Fotocoagulación panretiniana (PRP, Panretinal Photocoagulation)","Láser YAG posterior","Láser focal corneal","Observación en todos los casos"],0,"La PRP es un tratamiento fundamental de la PDR; la conducta se individualiza y puede incluir anti-VEGF o cirugía según el caso.","PRP"],["¿Qué tratamiento se utiliza para una rotura retinal sintomática con retina aplicada?",["Retinopexia con láser o crioterapia","PRP completa siempre","Oclusión ocular","Láser YAG"],0,"Las roturas sintomáticas con tracción pueden requerir retinopexia para crear una adhesión alrededor de la lesión.","Rotura retinal"],["¿Cuál es el mecanismo del desprendimiento de retina regmatógeno?",["Paso de líquido vítreo a través de una rotura al espacio subretiniano","Fuga exclusivamente coroidea","Tracción del nervio óptico","Opacificación del cristalino"],0,"Una rotura permite el paso de líquido al espacio subretiniano y separa la retina neurosensorial del EPR.","Desprendimiento de retina"],["PVD significa:",["Posterior Vitreous Detachment — desprendimiento vítreo posterior","Peripheral Vascular Disease","Posterior Vascular Degeneration","Primary Vitreous Disorder"],0,"PVD corresponde a desprendimiento vítreo posterior.","PVD"],["En un PVD sintomático, ¿qué hallazgo aumenta la sospecha de rotura retinal?",["Hemorragia vítrea o pigmento en vítreo","Catarata leve","Pingüécula","Ojo seco"],0,"La hemorragia vítrea o pigmento puede acompañar una rotura retinal y obliga a una evaluación cuidadosa.","PVD"],["¿Qué síntoma es clásico de tracción vítreorretiniana aguda?",["Fotopsias y miodesopsias nuevas","Diplopía monocular exclusivamente","Dolor intenso siempre","Prurito"],0,"Las fotopsias y nuevas miodesopsias son síntomas de alarma ante PVD/rotura retinal.","PVD"],["¿Qué estudio no puede descartar por sí solo una rotura retinal pequeña?",["Ultrasonido ocular","Oftalmoscopía indirecta con indentación","Biomicroscopía con lente apropiada","Examen periférico dilatado"],0,"El ultrasonido puede ser útil cuando los medios están opacos, pero no excluye todas las roturas pequeñas.","PVD"],["¿Qué es una membrana epirretiniana (ERM, Epiretinal Membrane)?",["Una proliferación fibrocelular sobre la superficie retinal interna","Líquido subretiniano","Desprendimiento del EPR","Hemorragia vítrea"],0,"La ERM se localiza sobre la superficie interna de la retina y puede producir tracción y metamorfopsias.","ERM"]];let i=0,errors=0;function draw(){let z=QS[i];document.getElementById("count").textContent="Pregunta "+(i+1)+" de "+QS.length;document.getElementById("q").innerHTML="<div class='question'>"+z[0]+"</div>";document.getElementById("answers").innerHTML=z[1].map((a,n)=>"<button class='answer' onclick='pick("+n+")'>"+String.fromCharCode(65+n)+") "+a+"</button>").join("");document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}function pick(n){let z=QS[i],bs=[...document.querySelectorAll(".answer")],ok=n===z[2];bs[z[2]].classList.add("correct");bs.forEach(b=>b.disabled=true);if(ok)addXP();else{bs[n].classList.add("wrong");errors++}document.getElementById("fb").innerHTML=(ok?"🎯 <b>Correcto.</b> +100 XP":"❌ <b>Incorrecto.</b>")+"<br><br><b>Perla:</b> "+z[3];document.getElementById("fb").classList.remove("hidden");document.getElementById("next").classList.remove("hidden")}document.getElementById("next").onclick=function(){i++;if(i>=QS.length){document.getElementById("q").innerHTML="<div class='question'>🎉 Ronda terminada</div>";document.getElementById("answers").innerHTML="<div class='card'>Errores: "+errors+" · XP total: "+XP+"</div>";document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden")}else draw()};draw();</script></body></html>
